flow:
  run_specific_stages: make_protein_sequence_clusters,make_dbs,make_sub_dbs,run_batch_searches,map_batch_alignments,collate_alignments,finalize_alignments,plan_score_batches,plan_interface_scores,make_interface_scores,finalize_interface_scores,make_batch_scores,collate_ligand_3d_candidates,plan_ligand_3d_scores,make_ligand_3d_scores,collate_ligand_3d_scores,merge_ligand_3d_scores,finalize_scores,export_ligand_similarity_scores,finalize_ligand_similarity_scores
  make_sub_dbs_cpu: 16
  run_batch_searches_batch_size: 5000
  map_batch_alignments_batch_size: 1
  make_interface_scores_batch_size: 1
  make_interface_scores_cpu: 4
  make_interface_scores_memory_limit: 32GB
  make_batch_scores_batch_size: 50
  make_batch_scores_cpu: 4
  make_ligand_3d_scores_batch_size: 30000
  make_ligand_3d_scores_cpu: 1
  collate_ligand_3d_candidates_batch_size: 4
  collate_ligand_3d_scores_batch_size: 4
  merge_ligand_3d_scores_batch_size: 4
data:
  plinder_mount: /plinder
  plinder_release: 2026-07
  plinder_release_number: "1"
scorer:
  sub_databases: holo,apo
  minimum_thresholds:
    protein_lddt_weighted_sum: 0.2
foldseek:
  min_seq_id: 0.0
mmseqs:
  min_seq_id: 0.0
