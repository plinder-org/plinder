name: CI Workflow

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  qa:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tox
        run: pip install tox
      - name: Run quality checks
        run: tox -e py312-lint,py312-type
      - name: Directory Cache
        uses: actions/cache@v4
        with:
          path: .tox
          key: tox-${{ runner.os }}-3.12-${{ hashFiles('tox.ini') }}
          restore-keys: |
            tox-${{ runner.os }}-3.12-

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=3.12
          init-shell: bash
          cache-downloads: true
          cache-environment: true
          post-cleanup: all
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install plinder
        run: UV_PROJECT_ENVIRONMENT="$CONDA_PREFIX" uv sync --inexact
      - name: Run tests
        env:
          PLINDER_OFFLINE: "true"
        run: python -m pytest -n auto -v
      - name: Post coverage comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}

  docs:
    name: Test documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup micromamba
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          create-args: python=3.12
          init-shell: bash
          cache-downloads: true
          cache-environment: true
          post-cleanup: all
      - name: Install Python requirements
        run: pip install six ".[docs,loader]"
      - name: Build the documentation
        run: sphinx-build --fail-on-warning docs build/docs
