[tox]
envlist = py312-{lint,type,test}
isolated_build = true
requires =
    tox >= 4
    tox-gh-actions
    tox-extras

[gh-actions]
python =
    3.12: py312

[testenv]
skip_sdist = true
skip_install = true


[testenv:py312-lint]
tox_extras=lint
deps =
    ruff == 0.9.4
    pre-commit == 2.21.0
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:py312-type]
tox_extras=type
deps =
    mypy == 1.18.2
    types-PyYAML
    types-requests
    pydantic
commands = mypy src

[testenv:py312-test]
setenv =
    PLINDER_LOG_LEVEL=10
    PLINDER_OFFLINE=true
passenv =
    PLINDER_REGISTRY
extras = test
commands = python flows/docker.py test --dirty {posargs}
