[project]
name = "plinder"
dynamic = ["version"]
dependencies = [
    "biotite >= 1.2",
    "numpy",
    "threadpoolctl>=3.6",
    "pandas",
    "pydantic",
    "tqdm",
    "peppr>=0.13",
    "voronotalt>=1.1",
    "rdkit>=2025.09.1",
    "pyarrow",
    "omegaconf",
    "duckdb",
    "cloudpathlib>=0.25,<0.26",
]
description = "PLINDER: Protein & Ligand INteraction Dataset and Evaluation Resource"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/plinder-org/plinder"
Issues = "https://github.com/plinder-org/plinder/issues"

[project.scripts]
plinder_download = "plinder.core.index.utils:download_plinder_cmd"
plinder_eval = "plinder.eval.cli:main"

[project.optional-dependencies]
data = ["google-cloud-storage", "gcsfs"]
lint = [
    "ruff == 0.9.4",
    "pre-commit == 2.21.0",
]
test = [
    "tox >= 4",
    "pytest == 7.2.0",
    "pytest-cov == 4.0.0",
    "pytest-xdist == 3.6.1",
    "tomli>=2",
    "build",
    "setuptools_scm[toml]",
]
type = [
    "mypy==1.18.2",
    "cloudpathlib>=0.25,<0.26",
    "types-PyYAML",
    "types-requests",
]
dev = [
    "plinder[lint,test,type,data]",
]
loader = [
    "torch",
]
eval = [
    "posebusters>=0.6.5",
]
plots = [
    "matplotlib",
    "seaborn",
    "mols2grid",
    "matplotlib_venn",
    "scipy",
]
docs = [
    "itables",
    "jupyter-sphinx",
    "jupyterlab_myst",
    "jupytext",
    "myst-nb",
    "myst-parser[linkify]",
    "numpydoc",
    "pydata-sphinx-theme == 0.15.4",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-gallery",
    "mols2grid",
    "matplotlib",
]

# Not published to PyPI; installed by default with `uv sync`.
# Mirrors requirements_data.txt, which remains for pip-based installs.
[dependency-groups]
dev = [
    "plinder[dev,eval,loader]",
    "networkit>11.0",
    "tabulate",
    "pdb-validation",
    "mmpdb",
]

[tool.uv.sources]
pdb-validation = { git = "https://git.scicore.unibas.ch/schwede/ligand-validation.git" }
mmpdb = { git = "https://github.com/rdkit/mmpdb.git" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "build",
    "setuptools",
    "setuptools_scm[toml]",
]

[tool.setuptools_scm]
root = "."

[tool.setuptools.packages.find]
where = ["src"]
include = ["plinder*"]
namespaces = false

[tool.setuptools.package-data]
plinder = [
    "**.yaml",
    "**.tsv",
    "plinder/data/annotations/static_files/*",
]

[tool.ruff]
line-length = 88
preview = false

[tool.ruff.lint]
select = [
    "F",
    "I",
]
ignore = [
    "E",
    "W",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false
untyped_calls_exclude = ["pyarrow"]
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "plinder.core.loader.dataset"
# Torch is an optional dependency and is absent from the lightweight type-check job.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "plinder._version"
ignore_errors = true
