[project]
name = "plinder"
dynamic = ["version"]
dependencies = [
    "biotite >= 1.2",
    "numpy",
    "threadpoolctl>=3.6",
    "pandas",
    "typing_extensions",
    "pydantic",
    "tqdm",
    "nbformat",
    "google-cloud-storage",
    "gcsfs",
    "peppr>=0.13",
    "voronotalt>=1.1",
    "rdkit>=2025.09.1",
    "pyarrow",
    "omegaconf",
    "duckdb",
    "cloudpathlib",
    "six",
]
description = "PLINDER: Protein & Ligand INteraction Dataset and Evaluation Resource"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/plinder-org/plinder"
Issues = "https://github.com/plinder-org/plinder/issues"

[project.scripts]
plinder_download = "plinder.core.index.utils:download_plinder_cmd"
plinder_eval = "plinder.eval.cli:main"

[project.optional-dependencies]
lint = [
    "ruff == 0.1.2",
    "pre-commit == 2.21.0",
]
test = [
    "tox >= 4",
    "pytest == 7.2.0",
    "pytest-cov == 4.0.0",
    "pytest-xdist == 3.6.1",
    "tomli>=2",
    "build",
    "setuptools_scm[toml]",
]
type = [
    "mypy==1.2.0",
    "types-PyYAML",
    "types-requests",
]
dev = [
    "plinder[lint,test,type]",
]
loader = [
    "torch",
]
eval = [
    "posebusters>=0.6.5",
]
plots = [
    "matplotlib",
    "seaborn",
    "mols2grid",
    "matplotlib_venn",
    "scipy",
]
docs = [
    "itables",
    "jupyter-sphinx",
    "jupyterlab_myst",
    "jupytext",
    "myst-nb",
    "myst-parser[linkify]",
    "numpydoc",
    "pydata-sphinx-theme == 0.15.4",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-gallery",
    "mols2grid",
    "matplotlib",
]

[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "build",
    "setuptools",
    "setuptools_scm[toml]",
]

[tool.setuptools_scm]
root = "."

[tool.setuptools.packages.find]
where = ["src"]
include = ["plinder*"]
namespaces = false

[tool.setuptools.package-data]
plinder = [
    "**.yaml",
    "**.tsv",
    "plinder/data/annotations/static_files/*",
]

[tool.ruff]
line-length = 88
select = [
    "F",
    "I",
]
ignore = [
    "E",
    "W",
]
preview = true

[tool.ruff.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
ignore_missing_imports = true
strict = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "plinder._version"
ignore_errors = true
